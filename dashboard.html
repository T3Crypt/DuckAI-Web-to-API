<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DuckAI Web-to-API</title>
<style>
:root{
  --bg:#101418; --panel:#161b21; --ink:#d6dbde; --dim:#7d8a91; --line:#242c33;
  --acc:#e8b64c; --ok:#7fb069; --bad:#c4553d; --mono:ui-monospace,'JetBrains Mono','Cascadia Mono','Fira Code',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5;padding:0 0 48px}
a{color:var(--acc);text-decoration:none}
header{border-bottom:1px solid var(--line);padding:22px 28px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font-size:15px;font-weight:600;letter-spacing:.02em}
h1 span{color:var(--dim);font-weight:400}
#clock{color:var(--dim)}
main{max-width:1060px;margin:0 auto;padding:28px 28px 0}
section{margin-bottom:34px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);font-weight:600;margin-bottom:12px}
h2::before{content:"// ";color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--panel);padding:14px 16px}
.stat .v{font-size:22px;font-weight:600;color:var(--ink)}
.stat .v.ok{color:var(--ok)} .stat .v.bad{color:var(--bad)}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-top:3px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
tr:last-child td{border-bottom:0}
.tier{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line)}
.tier.free{color:var(--ok);border-color:var(--ok)}
.tier.paid{color:var(--acc);border-color:var(--acc)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.idle{background:var(--dim)}
.pool-name{color:var(--ink)}
footer{max-width:1060px;margin:44px auto 0;padding:0 28px;color:var(--dim);font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>DuckAI <span>Web-to-API</span></h1>
  <div><span id="clock">—</span> &nbsp; <a href="/docs">api docs</a></div>
</header>
<main>
  <section>
    <h2>status</h2>
    <div class="grid">
      <div class="stat"><div class="v" id="s-status">—</div><div class="k">service</div></div>
      <div class="stat"><div class="v" id="s-models">—</div><div class="k">models in catalog</div></div>
      <div class="stat"><div class="v" id="s-catalog">—</div><div class="k">catalog</div></div>
      <div class="stat"><div class="v" id="s-tabs">—</div><div class="k">browser tabs</div></div>
      <div class="stat"><div class="v" id="s-pools">—</div><div class="k">pools</div></div>
      <div class="stat"><div class="v" id="s-uptime">—</div><div class="k">uptime</div></div>
    </div>
  </section>
  <section>
    <h2>model pools</h2>
    <table id="pools"><thead><tr><th>pool</th><th>tabs</th><th>browser</th></tr></thead>
    <tbody><tr><td colspan=3 style="color:var(--dim)">loading…</td></tr></tbody></table>
  </section>
  <section>
    <h2>catalog</h2>
    <table id="models"><thead><tr><th>model id</th><th>display name</th><th>tier</th></tr></thead>
    <tbody><tr><td colspan=3 style="color:var(--dim)">loading…</td></tr></tbody></table>
  </section>
</main>
<footer>
  <div>duck.ai session relay · unofficial · not affiliated with DuckDuckGo</div>
  <div>refresh 5s</div>
</footer>
<script>

const $ = id => document.getElementById(id);
function fmtUptime(ms){
  const s = Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  return d? d+"d "+h+"h" : h? h+"h "+m+"m" : (m? m+"m " : "") + (s%60)+"s";
}
function paint(d){
  $("s-status").textContent = d.status||"—";
  $("s-status").className = "v " + (d.status==="ok"?"ok":"bad");
  $("s-models").textContent = d.models ?? "—";
  const cat = $("s-catalog"); cat.textContent = d.catalog_live? "live":"fallback";
  cat.className = "v " + (d.catalog_live?"ok":"bad");
  const pools = d.pools||{};
  const names = Object.keys(pools);
  let tabs=0, conn=0;
  names.forEach(n=>{tabs+=pools[n].tabs; if(pools[n].connected)conn++;});
  $("s-tabs").textContent = tabs;
  $("s-pools").textContent = names.length+" ("+conn+" up)";
  $("s-uptime").textContent = d.uptime_s != null ? fmtUptime(d.uptime_s*1000) : "—";
  const tb = document.querySelector("#pools tbody");
  tb.innerHTML = names.length? names.map(n=>{
    const p=pools[n];
    return "<tr><td class='pool-name'>"+n+"</td><td>"+p.tabs+"</td><td><span class='dot "+(p.connected?"ok":"bad")+"'></span>"+(p.connected?"connected":"down")+"</td></tr>";
  }).join("") : "<tr><td colspan=3 style='color:var(--dim)'>no pools yet — send a request</td></tr>";
}
async function paintModels(){
  try{
    const r = await fetch("/v1/models"); const j = await r.json();
    const tb = document.querySelector("#models tbody");
    tb.innerHTML = j.data.map(m=>
      "<tr><td class='pool-name'>"+m.id+"</td><td style='color:var(--dim)'>"+(m.display_name||"")+"</td><td><span class='tier "+m.access+"'>"+m.access+"</span></td></tr>"
    ).join("");
  }catch(e){}
}
setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString(); fetch("/health").then(r=>r.json()).then(paint).catch(()=>{ $("s-status").textContent="down"; $("s-status").className="v bad"; });},5000);
fetch("/health").then(r=>r.json()).then(paint).catch(()=>{ $("s-status").textContent="down"; $("s-status").className="v bad"; });
$("clock").textContent=new Date().toLocaleTimeString();
paintModels(); setInterval(paintModels, 30000);
</script>
</body>
</html>
